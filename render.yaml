# Render Blueprint — one-click deploy of the whole stack.
# PostgreSQL is external (Neon) and supplied as DATABASE_URL when the Blueprint is applied.
services:
  # ── NestJS API: REST + Socket.IO + BullMQ worker + GPS simulator ──
  - type: web
    name: gfs-tms-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @gfs/api exec prisma generate && pnpm --filter @gfs/api build
    # Applies migrations and seeds demo data on the first boot of an empty database
    startCommand: pnpm --filter @gfs/api start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gfs-tms-redis
          property: connectionString
      - key: WEB_ORIGIN
        value: https://gfs-tms-is1u.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: SIMULATOR_AUTOPILOT
        value: "true"
      - key: SIMULATOR_TIME_SCALE
        value: "30"
      - key: ROUTING_PROVIDER
        value: osrm

  # ── Next.js dispatcher console (standalone server) ──
  - type: web
    name: gfs-tms
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: >-
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @gfs/web build &&
      cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static &&
      cp -r apps/web/public apps/web/.next/standalone/apps/web/public
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      # Read at build time: the /api/* rewrite target and the browser's Socket.IO origin
      - key: API_URL
        value: https://gfs-tms-api-is1u.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: https://gfs-tms-api-is1u.onrender.com

  # ── Redis: BullMQ queues, Socket.IO adapter, live positions, leader lock ──
  - type: keyvalue
    name: gfs-tms-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction # BullMQ must never have its keys evicted
    ipAllowList: [] # internal connections only
