# One-command local stack:  docker compose up --build
# then seed demo data once:  docker compose exec api pnpm db:seed
name: gfs-tms

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gfs_tms
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gfs_tms?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please-change-me-to-a-long-random-secret-value}
      SIMULATOR_ENABLED: 'true'
      SIMULATOR_AUTOPILOT: 'true'
      ROUTING_PROVIDER: osrm
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
